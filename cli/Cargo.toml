[package]
name = "clipstash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line access to clipstash history and snippets."

[[bin]]
name = "clipstash"
path = "src/main.rs"

[dependencies]
clipstash-core.workspace = true
clipstash-platform-macos.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
