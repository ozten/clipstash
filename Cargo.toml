[workspace]
resolver = "2"
members = ["core", "platform-macos", "cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clipstash-core = { path = "core" }
clipstash-platform-macos = { path = "platform-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
